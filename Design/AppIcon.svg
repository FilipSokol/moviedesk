<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3A3F8F"/>
      <stop offset="0.55" stop-color="#191D4A"/>
      <stop offset="1" stop-color="#0A0D22"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.75" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#21D4C4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#21D4C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#FF6B8A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardRose" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FF7A7F"/>
      <stop offset="1" stop-color="#C21E56"/>
    </linearGradient>
    <linearGradient id="cardCyan" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5FE1FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9FF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05061A" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- tło -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowTeal)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowRose)"/>

    <!-- plakaty z tyłu -->
    <g filter="url(#cardShadow)">
      <rect x="352" y="300" width="300" height="450" rx="44" fill="url(#cardRose)" transform="rotate(-15 502 525)"/>
      <rect x="372" y="300" width="300" height="450" rx="44" fill="url(#cardCyan)" transform="rotate(15 522 525)"/>
    </g>
    <!-- szklany plakat z przodu -->
    <g filter="url(#cardShadow)">
      <rect x="362" y="290" width="300" height="450" rx="44" fill="#1B2056" fill-opacity="0.55"/>
    </g>
    <rect x="362" y="290" width="300" height="450" rx="44" fill="url(#glass)"/>
    <rect x="363.5" y="291.5" width="297" height="447" rx="42.5" fill="none" stroke="url(#glassEdge)" stroke-width="3"/>
    <!-- odblask -->
    <path d="M406 300 h212 a40 40 0 0 1 34 20 L 420 520 a20 20 0 0 1 -48 -10 V 336 a40 40 0 0 1 34 -36 z" fill="#FFFFFF" fill-opacity="0.10"/>

    <!-- odtwarzanie -->
    <path d="M478 448 L478 582 Q478 600 494 591 L598 528 Q612 515 598 506 L494 441 Q478 432 478 448 Z" fill="#000" fill-opacity="0.25" filter="url(#soft)" transform="translate(4 10)"/>
    <path d="M478 448 L478 582 Q478 600 494 591 L598 528 Q612 515 598 506 L494 441 Q478 432 478 448 Z" fill="url(#play)"/>
  </g>
  <!-- krawędź szkła ikony -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
