name: MovieDesk

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX i APP_GROUP_ID pochodzą z xcconfig
# (Config/Local.xcconfig jest lokalny i nie trafia do repo).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MovieDesk:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Sprawdź Team ID
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "error: Brak Team ID. Skopiuj Config/Local.xcconfig.example jako Config/Local.xcconfig i wpisz DEVELOPMENT_TEAM."
            exit 1
          fi
    sources:
      - App
      - Shared
    dependencies:
      - target: MovieDeskWidget
      - sdk: WidgetKit.framework
      - sdk: ServiceManagement.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MovieDesk
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.entertainment
        MDAppGroupID: "$(APP_GROUP_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: "$(BUNDLE_ID_PREFIX).deeplink"
            CFBundleURLSchemes:
              - moviedesk
    entitlements:
      path: App/MovieDesk.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).MovieDesk"

  MovieDeskWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MovieDesk
        MDAppGroupID: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MovieDeskWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).MovieDesk.Widget"
        SKIP_INSTALL: YES
